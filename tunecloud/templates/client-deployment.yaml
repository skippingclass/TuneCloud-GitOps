apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunecloud-client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app: tunecloud-client
  template:
    metadata:
      labels:
        app: tunecloud-client
    spec:
      terminationGracePeriodSeconds: 15
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: tunecloud-client
          image: {{ .Values.client.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
