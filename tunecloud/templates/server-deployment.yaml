apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunecloud-server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tunecloud-server
  template:
    metadata:
      labels:
        app: tunecloud-server
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: tunecloud-server
          image: {{ .Values.server.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: spotify-secret
            - secretRef:
                name: jwt-secret
            - secretRef:
                name: admin
            - secretRef:
                name: postgres-secrets
            - secretRef:
                name: lastfm-secret
                optional: true
          env:
            - name: PUBLIC_URL
              value: {{ .Values.server.publicUrl | default "" | quote }}
            - name: LRC_RED_CONTACT_EMAIL
              value: {{ .Values.server.lrcRedContactEmail | default "" | quote }}
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@tunecloud-db:5432/$(POSTGRES_DB)"
            - name: MUSIC_DIR
              value: "/music"
            - name: TAG_EDITING_ENABLED
              value: "true"
            - name: TRUSTED_PROXIES
              value: "uniquelocal"
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: covers-storage
              mountPath: /app/covers
            - name: music-storage
              mountPath: /music
      volumes:
        - name: covers-storage
          persistentVolumeClaim:
            claimName: covers-pvc
        - name: music-storage
          hostPath:
            path: /mnt/HDD/Muzl0
            type: Directory
